# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Run OptiScalerBuilder - No Release - MFG - Latest

on:
  workflow_dispatch:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - uses: actions/checkout@v6
      with:
        repository: optiscaler/OptiScaler
        path: .
        submodules: recursive
        
    - name: OptiScaler - Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        # Ensure the file exists before proceeding
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }

        # Helper function to extract the first matching line for a version component
        function Get-Version-Component {
            param (
                [string]$pattern,
                [string]$replacement
            )
            # Use Select-String and take only the first match
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) {
                return ($line.Line -replace $replacement).Trim()
            } else {
                Write-Error "Pattern not found: $pattern"
                exit 1
            }
        }

        # Extract version components (only the first match for each pattern)
        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'

        # Merge into a single version string
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"

        # Get the current date and time
        $date = Get-Date -Format "yyyyMMdd_HHmmss"

        # Construct the output filename with version and timestamp
        $outputFileName = "OptiScaler_${version}_${date}"

        # Output the generated filename
        Write-Output "Generated Filename: $outputFileName"

        # Write outputs to GITHUB_OUTPUT
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      continue-on-error: false
      
    - name: OptiScaler - Debug Outputs
      run: |
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Filename: ${{ steps.get_version.outputs.filename }}"
        
        
    - name: OptiScaler - Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3
        
    - name: OptiScaler - Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal
      
    - name:  Customize OptiScaler
      shell: powershell
      run: |
        @(
          "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins"
        ) | ForEach-Object {
          if (Test-Path $_) {
            Write-Host "Folder already exists: $($_)"
          }
          else {
            Write-Host "Creating folder: $($_)"
          }

          New-Item -ItemType Directory -Path $_ -Force | Out-Null
        }

        @(
          "${{ github.workspace }}\x64\Release\a\Licenses",
          "${{ github.workspace }}\x64\Release\a\!! EXTRACT ALL FILES TO GAME FOLDER !!",
          "${{ github.workspace }}\x64\Release\a\setup_linux.sh",
          "${{ github.workspace }}\x64\Release\a\setup_windows.bat"
        ) | ForEach-Object {
          if (Test-Path $_) {
            Write-Host "Removing $($_)"
            Remove-Item $_ -Recurse -Force
          }
          else {
            Write-Host "Not found $($_)"
          }
        }

    - name:  Download Latest OptiPatcher
      id: optipatcher
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/optiscaler/OptiPatcher/releases/tags/rolling"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        Write-Host "OptiPatcher version output set: $($release.tag_name)"
        $asset = $release.assets | Where-Object { $_.name -match "\.asi$" } | Select-Object -First 1

        if (-not $asset) {
          throw "No OptiPatcher.asi asset found in rolling release."
        }

        $out = "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins\OptiPatcher.asi"

        Write-Host "Downloading $($asset.name)"
        Write-Host "Size: $([math]::Round($asset.size / 1MB, 2)) MB"

        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
      

    - name:  Download Latest dlssg_to_fsr3
      id: dlssg_to_fsr3
      shell: powershell
      run: |
        $dlssg_to_fsr3_version = "v0.130"
        "version=$dlssg_to_fsr3_version" >> $env:GITHUB_OUTPUT
        Write-Host "dlssg_to_fsr3 version output set: $dlssg_to_fsr3_version"

        Write-Host "Downloading dlssg_to_fsr3" "$dlssg_to_fsr3_version"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/bygalacos/OptiScalerBuilder/master/dlssg_to_fsr3/dlssg_to_fsr3_amd_is_better.zip" -OutFile "${{ github.workspace }}\dlssg_to_fsr3_amd_is_better.zip"
        Write-Host "Size: $([math]::Round((Get-Item "${{ github.workspace }}\dlssg_to_fsr3_amd_is_better.zip").Length / 1MB, 2)) MB"

        Write-Host "Extracting dlssg_to_fsr3" "$dlssg_to_fsr3_version"
        Expand-Archive -Path "${{ github.workspace }}\dlssg_to_fsr3_amd_is_better.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force

    - name: Download  Latest  MFGUnlocker
      id: mfgunlocker	 
      shell: powershell
      run: |	  
       #1. 配置目标仓库信息
       $owner = "dashdogy"
       $repo = "MFG-Unlocker"
       $apiUrl = "https://github.com"
       $extractPath = "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins"
       
       Write-Host "正在请求 GitHub API 获取最新 Release 信息..."
       
       # 2. 调用 GitHub API 获取最新 Release 详情（带 Token 避免限流）
       $headers = @{ "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
       $releaseInfo = Invoke-RestMethod -Uri $apiUrl -Headers $headers
       
       # 3. 筛选出 .zip 格式的成品
       $asset = $releaseInfo.assets | Where-Object { $_.name -like "MFGUnlocker*.zip" } | Select-Object -First 1
       
       if ($null -eq $asset) {
           Write-Error "未能在最新 Release 中找到 .zip 格式的成品文件！"
           exit 1
       }
       
       $downloadUrl = $asset.browser_download_url
       $fileName = $asset.name
       
       Write-Host "成功定位最新版本: $($releaseInfo.tag_name)"
       Write-Host "正在下载文件: $fileName"
       
       # 4. 下载 Zip 压缩包
       Invoke-WebRequest -Uri $downloadUrl -OutFile "${{ github.workspace }}\$fileName"
       
       # 5. 解压并转换后缀
       if (Test-Path $fileName) {
           Write-Host "下载成功，正在解压到 $extractPath ..."
           Expand-Archive -Path "${{ github.workspace }}\$fileName" -DestinationPath $extractPath -Force
           
           Write-Host "解压完成，正在将所有 .dll 文件后缀修改为 .asi ..."
           
           # 递归查找解压目录下的所有 .dll 文件
           $dllFiles = Get-ChildItem -Path $extractPath -Filter "*.dll" -Recurse
           
           if ($dllFiles.Count -eq 0) {
               Write-Warning "未在解压后的文件夹中找到任何 .dll 文件！"
           } else {
               foreach ($file in $dllFiles) {
                   # 计算新文件名的完整路径（替换后缀为 .asi）
                   $newPath = [System.IO.Path]::ChangeExtension($file.FullName, ".asi")
                   
                   Write-Host "正在重命名: $($file.FullName) -> $newPath"
                   Rename-Item -Path $file.FullName -NewName $newPath -Force
               }
               Write-Host "后缀转换全部完成！"
           }
           
       } else {
           Write-Error "文件下载失败，未能找到已下载的压缩包！"
           exit 1
       }

    - name: Compress the artifact
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r "${{ github.workspace }}\$zipName" "${{ github.workspace }}\x64\Release\a\*"

      continue-on-error: false
        
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error
