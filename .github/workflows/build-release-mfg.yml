    - name:  Download Latest dlssg-to-xefg-xmx
      id: dlssg-to-xefg-xmx
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/realdody/dlssg-to-xefg-xmx/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        Write-Host "dlssg-to-xefg-xmx version output set: $($release.tag_name)"
        $asset = $release.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1

        if (-not $asset) {
          throw "No dlssg-to-xefg ZIP was found in the latest release."
        }
        
        $out = "${{ github.workspace }}\dlssg-to-xefg.zip"

        Write-Host "Downloading $($asset.name)"
        Write-Host "Size: $([math]::Round($asset.size / 1MB, 2)) MB"

        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        Write-Host "Extracting $($asset.name)"
        Expand-Archive -Path $out -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler\custom" -Force

    - name:  Download Latest OptiPatcher
      id: optipatcher
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/optiscaler/OptiPatcher/releases/tags/rolling"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        Write-Host "OptiPatcher version output set: $($release.tag_name)"
        $asset = $release.assets | Where-Object { $_.name -match "\.asi$" } | Select-Object -First 1

        $match = [regex]::Match(
            $release.body,
            'Build commit:\*\*\s*([0-9a-f]{7})'
        )
        
        if (-not $match.Success) {
            Write-Host "Release Notes:"
            Write-Host $release.body
            throw "Failed to find Build commit SHA"
        }
        
        $sha = $match.Groups[1].Value       
        "sha=$sha" >> $env:GITHUB_OUTPUT
        Write-Host "Build commit: $sha"

        if (-not $asset) {
          throw "No OptiPatcher.asi asset found in rolling release."
        }

        $out = "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins\OptiPatcher.asi"

        Write-Host "Downloading $($asset.name)"
        Write-Host "Size: $([math]::Round($asset.size / 1MB, 2)) MB"

        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
      

    - name:  Download Latest dlssg_to_fsr3
      id: dlssg_to_fsr3
      shell: powershell
      run: |
        $dlssg_to_fsr3_version = "v0.130"
        "version=$dlssg_to_fsr3_version" >> $env:GITHUB_OUTPUT
        Write-Host "dlssg_to_fsr3 version output set: $dlssg_to_fsr3_version"

        Write-Host "Downloading dlssg_to_fsr3" "$dlssg_to_fsr3_version"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/bygalacos/OptiScalerBuilder/master/dlssg_to_fsr3/dlssg_to_fsr3_amd_is_better.zip" -OutFile "${{ github.workspace }}\dlssg_to_fsr3_amd_is_better.zip"
        Write-Host "Size: $([math]::Round((Get-Item "${{ github.workspace }}\dlssg_to_fsr3_amd_is_better.zip").Length / 1MB, 2)) MB"

        Write-Host "Extracting dlssg_to_fsr3" "$dlssg_to_fsr3_version"
        Expand-Archive -Path "${{ github.workspace }}\dlssg_to_fsr3_amd_is_better.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force


    - name:  Download libxess_fg
      id: libxess_fg
      shell: powershell
      run: |
        $libxess_fg_version = "1.3.4.95"
        "version=$libxess_fg_version" >> $env:GITHUB_OUTPUT
        Write-Host "libxess_fg version output set: $libxess_fg_version"

        Write-Host "Downloading libxess_fg" "$libxess_fg_version"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/juye2005/OptiScalerBuilder/master/libxess_fg/libxess_fg.zip" -OutFile "${{ github.workspace }}\libxess_fg.zip"
        Write-Host "Size: $([math]::Round((Get-Item "${{ github.workspace }}\libxess_fg.zip").Length / 1MB, 2)) MB"

        Write-Host "Extracting libxess_fg.zip" "$libxess_fg_version"
        Expand-Archive -Path "${{ github.workspace }}\libxess_fg.zip" -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler" -Force


    - name: Download Latest MFGUnlocker
      id: mfgunlocker
      shell: powershell
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/dashdogy/MFG-Unlocker/releases/latest"
        "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        Write-Host "MFGUnlocker version output set: $($release.tag_name)"
        $asset = $release.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1

        if (-not $asset) {
          throw "No MFGUnlocker ZIP was found in the latest release."
        }
        
        $out = "${{ github.workspace }}\MFGUnlocker.zip"

        Write-Host "Downloading $($asset.name)"
        Write-Host "Size: $([math]::Round($asset.size / 1MB, 2)) MB"

        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
        Write-Host "Extracting $($asset.name)"
        Expand-Archive -Path $out -DestinationPath "${{ github.workspace }}\x64\Release\a\OptiScaler\plugins" -Force

    - name: Compress the artifact
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r "${{ github.workspace }}\$zipName" "${{ github.workspace }}\x64\Release\a\*"

      continue-on-error: false
        
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.filename }}
        name: ${{ steps.get_version.outputs.filename }}
        body: |
          ## Current Build Info

          | Component | Version |
          |-----------|---------|
          | OptiScaler | ${{ steps.get_version.outputs.version }} - SHA: ${{ steps.get_version.outputs.sha }} |
          | OptiPatcher | ${{ steps.optipatcher.outputs.version }} - SHA: ${{ steps.optipatcher.outputs.sha }} |
          | dlssg_to_fsr3 | ${{ steps.dlssg_to_fsr3.outputs.version }} |
          | MFGUnlocker by dashdogy | ${{ steps.mfgunlocker.outputs.version }} |
          | dlssg-to-xefg-xmx by realdody | ${{ steps.dlssg-to-xefg-xmx.outputs.version }} |
          | libxess_fg | ${{ steps.libxess_fg.outputs.version }} |

          Build Package:
          `${{ steps.get_version.outputs.filename }}.7z`
        files: |
          ${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z
        prerelease: false
        make_latest: true
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
